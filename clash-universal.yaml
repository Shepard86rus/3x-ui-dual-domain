# ДОПОЛНЕНИЕ (необязательно): секции DNS/sniffer для Clash Verge и других клиентов.
# Через ссылку subClashRules панель эти секции НЕ доставляет (она берёт только группы,
# провайдеры и правила). Используйте как файл "Merge" в Clash Verge или вставьте
# целиком в поле subClashRules текстом (тогда обновления файла вручную).
# Требуется Mihomo >= 1.19 (rule-set в nameserver-policy и sniffer.skip-dst-address).

unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "stun.*.*"
    - "stun.*.*.*"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stunprotocol.org"
  default-nameserver:
    - 77.88.8.8
    - 77.88.8.1
  proxy-server-nameserver:
    - 77.88.8.8
    - 77.88.8.1
  nameserver:
    - "https://8.8.8.8/dns-query#PROXY"
    - "https://1.1.1.1/dns-query#PROXY"
  nameserver-policy:
    "rule-set:category-ru@domain":
      - 77.88.8.8
      - 77.88.8.1

sniffer:
  enable: true
  sniff:
    HTTP: { ports: [80, 8080] }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  skip-dst-address:
    - "rule-set:telegram@ipcidr"
    - "rule-set:whatsapp@ipcidr"
