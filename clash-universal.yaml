# Универсальный Clash/Mihomo-профиль маршрутизации для lucx-ui (subClashRules).
# Содержит ТОЛЬКО proxy-groups, rule-providers и rules: узлы клиента панель добавляет
# из подписки сама. Здесь нет ни UUID, ни ключей, ни адресов серверов.
# Логика: российское, службы из списков и CDN идут по своим группам, заблокированное
# (re-filter) через PROXY, всё остальное напрямую (MATCH,DIRECT).

